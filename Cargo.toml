[workspace]
resolver = "3"
members = ["crates/*", "examples/demo", "examples/lms"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/irisvn/RustCMS-Core"
homepage = "https://irisvn.github.io/RustCMS/"
keywords = ["cms", "admin", "framework", "axum", "seaorm"]
categories = ["web-programming", "web-programming::http-server"]

[workspace.dependencies]
rustcms-core = { path = "crates/rustcms-core", version = "0.4.0" }
rustcms-admin = { path = "crates/rustcms-admin", version = "0.4.0", default-features = false }
rustcms-migration = { path = "crates/rustcms-migration", version = "0.4.0" }
rustcms-testing = { path = "crates/rustcms-testing", version = "0.4.0" }
rustcms-auth = { path = "crates/rustcms-auth", version = "0.4.0" }

# Pinned: SeaORM API churns between majors (see docs/core/adr/0001).
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "macros", "runtime-tokio-rustls", "with-chrono", "with-uuid", "with-rust_decimal", "with-json",
] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio-rustls"] }
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# The version axum's `ws` uses (clients in tests, error kinds on the server).
tokio-tungstenite = { version = "0.29", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit", "util"] }
http-body-util = "0.1"
figment = { version = "0.10.19", features = ["toml", "env"] }
dotenvy = "0.15.7"
clap = { version = "4.6", features = ["derive", "string"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ipnet = { version = "2.12", features = ["serde"] }
base64 = "0.23"
rand = "0.10"
anyhow = "1.0"
minijinja = { version = "3.0", features = ["serde"] }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
csv = "=1.3.1"
ammonia = "=4.2.4"
include_dir = "0.7.4"
argon2 = "0.6"
sha2 = "0.11"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
hmac = "0.13"
aes-gcm = "0.11.1"
subtle = "2.6"
hex = "0.4"
moka = { version = "0.12", features = ["future"] }
toml = "1"
toml_edit = "0.25.17"
semver = "1.0.28"
assert_cmd = "2.2"
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
object_store = { version = "0.14", default-features = false }
infer = "0.22"
cap-std = "4.0"
imagesize = "0.15"
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rust_decimal = "1.43"
tracing = "0.1"
insta = { version = "1.49", features = ["json"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing is far too slow unoptimised; tests hash on every sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
