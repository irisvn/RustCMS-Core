# A test stuck (a lock never released, a wait without deadline) fails after
# five minutes instead of holding the whole run.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Tests that time leases and heartbeats run alone: on a loaded machine (the
# whole matrix at once), a stalled disk can delay a heartbeat past its timeout
# and the worker rightly gives the job up.
[[profile.default.overrides]]
filter = 'test(heartbeats_keep_a_long_run_owned)'
threads-required = 'num-cpus'

# CI (`--profile ci`): a test that fails once is retried once and reported as
# flaky, so a loaded runner does not fail the run; a test that fails twice does.
[profile.ci]
retries = 1
failure-output = "immediate-final"
