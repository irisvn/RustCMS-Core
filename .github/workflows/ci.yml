name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci
        working-directory: admin-ui
      - run: npm run lint && npm run typecheck
        working-directory: admin-ui

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just features

  # The declared `rust-version` (keep in sync with `Cargo.toml`).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test-rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RUSTCMS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - run: cargo test --workspace --doc
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: -D warnings }
      - run: mdbook build docs

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: cargo run -q -p rustcms-cli -- docs:cli > docs/src/cli.md
      - run: UPDATE_TYPES=1 cargo test -q -p rustcms-admin --features ts --test typescript
      - run: npm ci && npm run build
        working-directory: admin-ui
      # Untracked files count too (a new hashed asset not committed).
      - run: test -z "$(git status --porcelain -- docs/src/cli.md admin-ui/src/api/types.gen.ts crates/rustcms-admin/assets fixtures)" || (git status --porcelain; exit 1)
      # Published crates embed the built panel, never the placeholder.
      - run: cargo package -p rustcms-admin --list --allow-dirty | grep -q '^assets/index.html$'

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci && npm test
        working-directory: admin-ui

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: admin-ui
      # The committed assets, embedded in a release binary run from a temp directory.
      - run: cargo build --release -p demo && cp target/release/demo "$RUNNER_TEMP/demo"
      - run: npm run e2e
        working-directory: admin-ui
        env: { RUSTCMS_DEMO_BIN: "${{ runner.temp }}/demo", CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: admin-ui/playwright-report }

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustcms-cli --test scaffold -- --include-ignored

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev
        working-directory: admin-ui
