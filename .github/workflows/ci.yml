name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run. The
# release workflow waits for this workflow's run on the tagged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: shellcheck -s sh dist/install.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features rustcms/redis,rustcms/s3 -- -D warnings
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci
        working-directory: admin-ui
      - run: npm run lint && npm run typecheck
        working-directory: admin-ui

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just features

  # The declared `rust-version` (keep in sync with `Cargo.toml`).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check -p rustcms --features redis,s3

  # Rust tests: built once into a nextest archive, then run in three shards
  # at once (SQLite with every non-database test, PostgreSQL, MySQL). Database
  # servers keep their data in memory without fsync, as in docker-compose.yml.
  test-build:
    runs-on: ubuntu-latest
    env:
      # Dozens of test binaries: without debug info they fit the runner's disk
      # (the linker died with SIGBUS when it filled up).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: cargo nextest archive --workspace --features rustcms/redis,rustcms/s3 --archive-file tests.tar.zst
      - uses: actions/upload-artifact@v4
        with: { name: nextest-archive, path: tests.tar.zst, retention-days: 1 }

  test-rust:
    needs: test-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every test without a database variant runs here, once.
          - { shard: sqlite, filter: "not (test(/::postgres$/) | test(/::mysql$/))", require: "redis,s3,smtp" }
          - { shard: postgres, filter: "test(/::postgres$/)", require: "postgres,redis,s3,smtp" }
          - { shard: mysql, filter: "test(/::mysql$/)", require: "mysql,redis,s3,smtp" }
    name: test-rust (${{ matrix.shard }})
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
      # S3-compatible bucket for the storage tests (MinIO no longer publishes images).
      s3:
        image: adobe/s3mock:5.2.3
        env: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rustcms-test }
        ports: ["9090:9090"]
      # Catches every mail (invitations, password resets, the SMTP tests).
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["51025:1025", "58025:8025"]
    env:
      RUSTCMS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      RUSTCMS_TEST_MYSQL: mysql://root:mysql@localhost:3306/mysql
      RUSTCMS_TEST_REDIS: redis://localhost:6379
      RUSTCMS_TEST_S3: http://localhost:9090/rustcms-test
      RUSTCMS_TEST_SMTP: 127.0.0.1:51025
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # A server that is not reachable fails the run instead of being skipped.
      RUSTCMS_TEST_REQUIRE: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - uses: actions/download-artifact@v4
        with: { name: nextest-archive }
      # Services cannot take server flags: the databases are started here.
      - name: Start PostgreSQL
        if: matrix.shard == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres --tmpfs /var/lib/postgresql/data \
            postgres:17-alpine postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres -h 127.0.0.1 && exit 0; sleep 1; done; exit 1
      - name: Start MySQL
        if: matrix.shard == 'mysql'
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=mysql --tmpfs /var/lib/mysql mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=OFF --innodb-flush-method=nosync --sync-binlog=0 --skip-log-bin
          for i in $(seq 1 120); do docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent && exit 0; sleep 1; done; exit 1
      - name: Wait for the S3 bucket
        run: for i in $(seq 1 60); do curl -sf --connect-timeout 2 -m 5 -o /dev/null "$RUSTCMS_TEST_S3" && exit 0; sleep 1; done; exit 1
      - run: >-
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --profile ci
          -E '${{ matrix.filter }}'

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - run: cargo test --workspace --doc
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: -D warnings }
      - run: mdbook build docs/guide

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: cargo run -q -p rustcms-cli -- docs:cli > docs/guide/src/reference/cli.md
      - run: UPDATE_TYPES=1 cargo test -q -p rustcms-admin --features ts --test typescript
      - run: npm ci && npm run build
        working-directory: admin-ui
      # Untracked files count too (a new hashed asset not committed).
      - run: test -z "$(git status --porcelain -- docs/guide/src/reference/cli.md admin-ui/src/api/types.gen.ts crates/rustcms-admin/assets fixtures)" || (git status --porcelain; exit 1)
      # Published crates embed the built panel, never the placeholder.
      - run: cargo package -p rustcms-admin --list --allow-dirty | grep -q '^assets/index.html$'

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci && npm test
        working-directory: admin-ui

  e2e:
    runs-on: ubuntu-latest
    # Invitations and password resets are read back from Mailpit (`e2e/serve.sh`).
    services:
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["51025:1025", "58025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: admin-ui
      # The committed assets, embedded in a release binary run from a temp directory.
      - run: cargo build --release -p demo && cp target/release/demo "$RUNNER_TEMP/demo"
      - run: npm run e2e
        working-directory: admin-ui
        env: { RUSTCMS_DEMO_BIN: "${{ runner.temp }}/demo", CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: admin-ui/playwright-report }

  # A generated application on every platform the release ships for.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every test of the command (unit, self-update), the generated app included.
      - run: cargo test -p rustcms-cli -- --include-ignored

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev
        working-directory: admin-ui
