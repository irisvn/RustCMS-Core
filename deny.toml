[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (informational, no vulnerability). SeaORM's `with-chrono`, sqlx, croner and
    # our date handling depend on it; moving to `time`/`jiff` is a separate change. Revisit at each release.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained: no fix, needed by SeaORM; tracked for a later migration" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "0BSD", "BSL-1.0"]
# The example apps (`publish = false`) have no license of their own.
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# sqlx is patched to an unreleased commit until a release allows libsqlite3-sys >= 0.39
# (RUSTSEC-2026-0459). Remove with the `[patch.crates-io]` section of Cargo.toml.
allow-git = ["https://github.com/launchbadge/sqlx"]
