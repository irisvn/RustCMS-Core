# Local services for development and the test matrix.
# Tests: RUSTCMS_TEST_PG=postgres://postgres:postgres@localhost:55439/postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${RUSTCMS_PG_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
