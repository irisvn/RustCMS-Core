# Local services for development and the test matrix.
# Tests: RUSTCMS_TEST_PG=postgres://postgres:postgres@localhost:55439/postgres
#        RUSTCMS_TEST_MYSQL=mysql://root:mysql@localhost:53306/mysql
#        RUSTCMS_TEST_REDIS=redis://localhost:56379
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${RUSTCMS_PG_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    ports:
      - "${RUSTCMS_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine
    ports:
      - "${RUSTCMS_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
