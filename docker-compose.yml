# Local services for development and the test matrix.
# Tests: RUSTCMS_TEST_PG=postgres://postgres:postgres@localhost:55439/postgres
#        RUSTCMS_TEST_MYSQL=mysql://root:mysql@localhost:53306/mysql
#        RUSTCMS_TEST_REDIS=redis://localhost:56379
#        RUSTCMS_TEST_S3=http://localhost:59000/rustcms-test (any AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#        RUSTCMS_TEST_SMTP=127.0.0.1:51025 (Mailpit; its UI on http://localhost:58025)
#        RUSTCMS_TEST_SMTP_TLS=localhost:51026 RUSTCMS_TEST_SMTP_TLS_CA=.test-tls/ca.pem (`just test-tls-cert`)
services:
  # Test servers keep their data in memory and never fsync: much faster, and
  # nothing to lose (every test makes its own database). Never use these flags
  # for data you keep.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${RUSTCMS_PG_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_bin"
      - "--innodb-flush-log-at-trx-commit=0"
      - "--innodb-doublewrite=OFF"
      - "--innodb-flush-method=nosync"
      - "--sync-binlog=0"
      - "--skip-log-bin"
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${RUSTCMS_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine
    ports:
      - "${RUSTCMS_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # S3-compatible server for the storage tests (MinIO no longer publishes images).
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rustcms-test
    ports:
      - "${RUSTCMS_S3_PORT:-59000}:9090"
  # SMTP server catching every mail (development and the mail tests).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${RUSTCMS_SMTP_PORT:-51025}:1025"
      - "${RUSTCMS_MAILPIT_UI_PORT:-58025}:8025"
  # The same with STARTTLS (a certificate for `localhost` signed by a test CA,
  # made by `just test-tls-cert`) and any credentials accepted: the TLS mail tests.
  mailpit-tls:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_TLS_CERT: /tls/cert.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - ./.test-tls:/tls:ro
    ports:
      - "${RUSTCMS_SMTP_TLS_PORT:-51026}:1025"
