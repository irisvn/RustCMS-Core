[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.rustcms]
version = "0.8.0"

[dependencies]
rustcms = { path = "../../crates/rustcms" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid", "with-rust_decimal", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false }
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
clap = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rustcms-testing = { path = "../../crates/rustcms-testing", features = ["mail"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
