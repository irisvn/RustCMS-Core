[package]
name = "rustcms-core"
description = "Core of the rustcms framework: config, app builder, HTTP stack, console, errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
# S3-compatible storage (`storage.disk = "s3"`).
s3 = ["dep:object_store", "object_store/aws", "dep:futures-util"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
figment.workspace = true
http-body-util.workspace = true
ipnet.workspace = true
rand.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
cap-std.workspace = true
object_store = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
