[package]
name = "rustcms-admin"
description = "Filament-style admin panel engine for rustcms: resources, schema, generic CRUD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["rustcms-core/sqlite"]
postgres = ["rustcms-core/postgres"]
# TypeScript bindings of the schema DTOs for the admin SPA (`just generated`).
ts = ["dep:ts-rs"]

[dependencies]
rustcms-core.workspace = true
rustcms-auth.workspace = true
axum.workspace = true
sea-orm.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
tokio.workspace = true
rust-embed.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
rustcms-testing.workspace = true
rustcms-migration.workspace = true
toml.workspace = true
tokio.workspace = true
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
