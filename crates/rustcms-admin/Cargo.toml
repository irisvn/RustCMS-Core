[package]
exclude = ["tests/"]
name = "rustcms-admin"
description = "Filament-style admin panel engine for rustcms: resources, schema, generic CRUD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sqlite"]
sqlite = ["rustcms-core/sqlite"]
postgres = ["rustcms-core/postgres"]
mysql = ["rustcms-core/mysql"]
redis = ["rustcms-core/redis", "rustcms-auth/redis"]
# TypeScript bindings of the schema DTOs for the admin SPA (`just generated`).
ts = ["dep:ts-rs"]

[dependencies]
rustcms-core.workspace = true
rustcms-auth.workspace = true
axum.workspace = true
sea-orm.workspace = true
async-trait.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
infer.workspace = true
imagesize.workspace = true
hex.workspace = true
form_urlencoded = "1"
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
tokio.workspace = true
rust-embed.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
# Path only (no version): not published, so the published crate does not depend on
# rustcms-testing (which depends on rustcms-auth). Tests are excluded from the package.
rustcms-testing = { path = "../rustcms-testing" }
rustcms-migration = { path = "../rustcms-migration" }
toml.workspace = true
base64.workspace = true
tokio.workspace = true
insta.workspace = true
proptest.workspace = true
http-body = "1"

[lints]
workspace = true
