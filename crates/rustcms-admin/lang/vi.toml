# Vietnamese labels the server sends for the framework's own resources and
# common field names. The panel's interface itself is translated in admin-ui.
# Applications override any of these in their own catalog.

"Content" = "Nội dung"
"System" = "Hệ thống"
# Permission groups of the audit log, settings and queue pages.
"Audit" = "Nhật ký"
"Settings" = "Cài đặt"
"Queue" = "Hàng đợi"
"Schedules" = "Lịch chạy"
"Dashboard" = "Bảng điều khiển"
# The media library's own permissions on the Roles page.
"See every file" = "Xem mọi tệp"
"List, open and use every file of the media library in records, not only one's own uploads. Editing, trashing, restoring or deleting another user's file needs \"Manage every file\"." = "Liệt kê, mở và dùng mọi tệp của thư viện media trong bản ghi, không chỉ tệp mình tải lên. Sửa, đưa vào thùng rác, khôi phục hoặc xoá tệp của người khác cần quyền \"Quản lý mọi tệp\"."
"Manage every file" = "Quản lý mọi tệp"
"See every file, and edit, trash, restore or delete other users' files (with the update, delete, restore and force delete permissions of the media library)." = "Xem mọi tệp, và sửa, đưa vào thùng rác, khôi phục hoặc xoá tệp của người khác (cùng các quyền cập nhật, xoá, khôi phục và xoá vĩnh viễn của thư viện media)."
"Alternative text" = "Văn bản thay thế"

