[package]
name = "rustcms"
description = "A Laravel- and Filament-inspired framework for admin panels and headless CMS backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = ["rustcms-core/sqlite", "rustcms-admin/sqlite"]
postgres = ["rustcms-core/postgres", "rustcms-admin/postgres"]
mysql = ["rustcms-core/mysql", "rustcms-admin/mysql"]
# Several instances: shared rate limits and single-runner jobs through Redis.
redis = ["rustcms-core/redis", "rustcms-auth/redis", "rustcms-admin/redis"]
# S3-compatible storage for uploads (`storage.disk = "s3"`).
s3 = ["rustcms-core/s3"]

[dependencies]
rustcms-core.workspace = true
rustcms-admin.workspace = true
rustcms-auth.workspace = true
rustcms-migration.workspace = true
axum.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true
async-trait.workspace = true
clap.workspace = true

[lints]
workspace = true
