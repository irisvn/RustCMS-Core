[package]
exclude = ["tests/"]
name = "rustcms-auth"
description = "Authentication (session and token guards), roles, permissions and policies for rustcms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Rate limits shared by every instance through Redis (see `rustcms_core::redis`).
redis = ["rustcms-core/redis", "dep:redis"]

[dependencies]
futures-util.workspace = true
redis = { workspace = true, optional = true }
rustcms-core = { workspace = true, features = ["mail"] }
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
hmac.workspace = true
moka.workspace = true
rand.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures = "0.3"
chrono.workspace = true
rustcms-core = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
rustcms-migration = { path = "../rustcms-migration" }
# Path only (no version): not published, so the published crate does not depend on
# rustcms-testing (which depends on rustcms-auth). Tests are excluded from the package.
rustcms-testing = { path = "../rustcms-testing", features = ["mail"] }
serde = { workspace = true }
toml.workspace = true
# Paused time: tests cross the hourly schedules.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
